name: Daily A-share Low/High Report

on:
  schedule:
    # 北京时间 17:30（收盘后数据就绪），周一至周五。UTC = 北京时间 -8h
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip openpyxl

      - name: Fetch index K-line & compute
        run: |
          for i in $(seq 1 5); do
            if python fetch_compute.py; then
              echo "fetch index ok"; exit 0
            fi
            echo "fetch_compute 第 $i 次失败，25s 后重试"; sleep 25
          done
          echo "fetch_compute 最终失败"; exit 1

      # ETF 数据仅用于叠加图，属可选数据：抓取失败不应阻断报表生成
      - name: Fetch ETF K-line (optional)
        continue-on-error: true
        run: |
          for i in $(seq 1 3); do
            if python fetch_etf.py; then
              echo "fetch ETF ok"; exit 0
            fi
            echo "fetch_etf 第 $i 次失败，25s 后重试"; sleep 25
          done
          echo "::warning::ETF 抓取失败，本次报表跳过 ETF 叠加图"
          exit 0

      - name: Build HTML / Excel
        run: python build_outputs.py

      - name: Publish Pages artifact (index.html)
        run: cp index_low_high_report.html index.html

      # 与本地 17:00 共用 notify.py：同一份 results.json → live、同一段摘要模板、
      # 同一个 latest_summary.txt，保证手机消息与线上产物逐字一致。
      # 未配置 Secret 时 notify.py 只打印 WEBHOOK_NOT_SET，不会让报表任务失败。
      - name: Build shared summary & push to Feishu / WeCom
        env:
          REPORT_WEBHOOK: ${{ secrets.REPORT_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          python notify.py --send --source "云端 17:30" \
            --state-file .cloud_push_state.json \
            --write-summary latest_summary.txt

      - name: Commit & push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index_low_high_report.html index.html latest_summary.txt .cloud_push_state.json
          git diff --cached --quiet || git commit -m "chore: daily update $(date +%F)"
          git push
